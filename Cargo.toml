[package]
name = "pryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Evidence-based Linux system diagnostics for Wi-Fi, Bluetooth, and audio"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
