[package]
name = "pryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Read-only Linux diagnostics for Wi-Fi, Bluetooth, and audio"
repository = "https://github.com/MQSethar/pryn"
readme = "README.md"
documentation = "https://docs.rs/pryn"
license = "MIT OR Apache-2.0"
keywords = ["linux", "diagnostics", "wifi", "bluetooth", "audio"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", features = ["blocking-api"] }
pulseaudio = "0.3.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
